# Builds the Windows game and publishes a GitHub Release whenever a version tag is pushed.
# Usage: .\tools\release.ps1 0.2.0   (bumps version, commits, tags, pushes -> this runs)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Get-Content project.godot) -replace 'config/version="[^"]*"', "config/version=""$v""" | Set-Content project.godot -Encoding utf8
          Select-String -Path project.godot -Pattern 'config/version'

      - name: Download Godot + export templates
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable"
          curl.exe -L -o godot.zip "$base/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip"
          Expand-Archive godot.zip -DestinationPath godot
          $exe = (Get-ChildItem godot -Filter "*_console.exe" -Recurse | Select-Object -First 1).FullName
          "GODOT=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          curl.exe -L -o templates.tpz "$base/Godot_v$env:GODOT_VERSION-stable_export_templates.tpz"
          $dest = "$env:APPDATA\Godot\export_templates\$env:GODOT_VERSION.stable"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Expand-Archive templates.tpz -DestinationPath tpl
          Copy-Item tpl\templates\* $dest -Recurse -Force
          Get-ChildItem $dest | Select-Object Name

      - name: Import + export
        shell: pwsh
        run: |
          & $env:GODOT --headless --path . --import
          New-Item -ItemType Directory -Force build | Out-Null
          & $env:GODOT --headless --path . --export-release "Windows Desktop" build/OmniVerse.exe
          New-Item -ItemType Directory -Force build/linux | Out-Null
          & $env:GODOT --headless --path . --export-release "Linux" build/linux/OmniVerse.x86_64
          Get-ChildItem build -Recurse

      - name: Zip (used by the in-game auto-updater)
        shell: pwsh
        run: |
          Compress-Archive -Path build\OmniVerse.exe, build\OmniVerse.pck -DestinationPath "build\OmniVerse-$env:VERSION-windows.zip"
          Compress-Archive -Path build\linux\OmniVerse.x86_64, build\linux\OmniVerse.pck -DestinationPath "build\OmniVerse-$env:VERSION-linux.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\omniverse.iss /DVersion=$env:VERSION
          Get-ChildItem build

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "build\OmniVerse-Setup.exe#OmniVerse Installer (Windows)" `
            "build\OmniVerse-$env:VERSION-windows.zip#Windows portable zip / auto-update package" `
            "build\OmniVerse-$env:VERSION-linux.zip#Linux build (unzip, chmod +x OmniVerse.x86_64, run)" `
            --title "OmniVerse v$env:VERSION" --generate-notes
